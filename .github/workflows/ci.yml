name: MLOPS Pipeline

on:
  pull_request:
    branches:
      - develop

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - name: repo checkout
        uses: actions/checkout@v5

      - name: authenticate gcp
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true
          export_environment_variables: true

      - name: setup google cloud sdk
        uses: google-github-actions/setup-gcloud@v3

      - name: provision instance
        run: |
          CONTAINER_SPEC="spec:
            containers:
              - name: github-runner
                image: myoung34/github-runner:latest
                env:
                  - name: REPO_URL
                    value: 'https://github.com/varunanven/mlops-pytorch-pipeline'
                  - name: RUNNER_TOKEN
                    value: '${{ secrets.PERSONAL_ACCESS_TOKEN }}'
                  - name: RUNNER_LABELS
                    value: 'ga-spot-instance'
                volumeMounts:
                  - name: docker-socket
                    readOnly: false
                    path: /var/run/docker.sock
            volumes:
              - name: docker-socket
                hostPath:
                  path: /var/run/docker.sock"

          gcloud compute instances create "ga-instance" \
            --zone=us-central1-b \
            --source-instance-template=ga-gpu-spot-instance-template \
            --metadata="gce-container-declaration=$CONTAINER_SPEC"

  training:
    needs: setup
    runs-on: [self-hosted, ga-spot-instance]
    steps:
      - name: repo checkout
        uses: actions/checkout@v5

      - name: execute model train
        run: python3 train.py

      - name: set checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: l4-spot-weights
          path: model.pth

  cleanup:
    needs: [setup, training]
    runs-on: ubuntu-latest
    steps:
      - name: shutdown instance
        run: |
          gcloud compute instances delete ga-runner-{{ github.run_id }} --zone=us-central1-a --quiet