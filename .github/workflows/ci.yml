name: MLOPS Pipeline

on:
  pull_request:
    branches:
      - develop

env:
  ZONE: us-central1-a
  INSTANCE: ga-runner-${{ github.run_id }}
  LABEL: ga-spot-${{ github.run_id }}

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: provision gpu runner
        run: |
          set -e

          TOKEN=$(curl -sX POST \
            -H "Authorization: Bearer ${{ secrets.PERSONAL_ACCESS_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/runners/registration-token \
            | jq -r .token)
          test "$TOKEN" != null

          gcloud compute instances create "$INSTANCE" \
            --zone="$ZONE" \
            --source-instance-template=train-instance-template-2 \
            --metadata=startup-script="#!/usr/bin/env bash
          set -euo pipefail

          if ! command -v docker >/dev/null 2>&1; then
            apt-get update
            apt-get install -y docker.io
          fi

          systemctl enable --now docker
          usermod -aG docker ubuntu

          su - ubuntu -c 'mkdir -p ~/actions-runner && cd ~/actions-runner && curl -L -o runner.tgz https://github.com/actions/runner/releases/download/v2.336.0/actions-runner-linux-x64-2.336.0.tar.gz && tar xzf runner.tgz && ./config.sh --url https://github.com/${{ github.repository }} --token $TOKEN --labels $LABEL --unattended --replace --ephemeral && ./run.sh'"

  training:
    needs: setup
    runs-on: [self-hosted, "ga-spot-${{ github.run_id }}"]
    steps:
      - uses: actions/checkout@v5

      - name: train model
        run: |
          docker build -f docker/Dockerfile.train -t mlops-train .
          docker create --name mlops-train-run mlops-train
          docker start -a mlops-train-run
          docker cp mlops-train-run:/app/checkpoints/cifar10_model.pt cifar10_model.pt
          docker rm mlops-train-run

      - name: serve model
        run: |
          docker build -f docker/Dockerfile.serve -t mlops-serve .
          docker create --name mlops-serve-run mlops-serve
          docker start -a mlops-serve-run

  cleanup:
    needs: [setup, training]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: delete gpu runner
        run: gcloud compute instances delete "$INSTANCE" --zone="$ZONE" --quiet || true
