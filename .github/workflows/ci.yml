name: MLOPS Pipeline

on:
  pull_request:
    branches:
      - develop

env:
  ZONE: us-central1-a
  INSTANCE: train-instance-2
  RUNNER_LABEL: ga-gpu-runner

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Verify existing GPU instance
        run: |
          set -euo pipefail

          STATUS=$(gcloud compute instances describe "$INSTANCE" \
            --zone="$ZONE" \
            --format='value(status)')

          echo "Instance status: $STATUS"

          if [ "$STATUS" != "RUNNING" ]; then
            echo "ERROR: Instance $INSTANCE is not running."
            exit 1
          fi

      - name: Get GitHub runner registration token
        id: runner-token
        run: |
          set -euo pipefail

          TOKEN=$(curl -fsSL -X POST \
            -H "Authorization: Bearer ${{ secrets.PERSONAL_ACCESS_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/runners/registration-token \
            | jq -r .token)

          test -n "$TOKEN"
          test "$TOKEN" != "null"

          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Configure existing VM as GitHub Actions runner
        run: |
          set -euo pipefail

          gcloud compute ssh "$INSTANCE" \
            --zone="$ZONE" \
            --command="
              set -euo pipefail

              if ! command -v docker >/dev/null 2>&1; then
                sudo apt-get update
                sudo apt-get install -y docker.io
              fi

              sudo systemctl enable --now docker

              sudo usermod -aG docker ubuntu || true

              sudo -u ubuntu mkdir -p /home/ubuntu/actions-runner
              cd /home/ubuntu/actions-runner

              if [ ! -f ./run.sh ]; then
                curl -L -o runner.tgz \
                  https://github.com/actions/runner/releases/download/v2.336.0/actions-runner-linux-x64-2.336.0.tar.gz

                tar xzf runner.tgz
                rm -f runner.tgz
              fi

              ./config.sh \
                --url https://github.com/${{ github.repository }} \
                --token '${{ steps.runner-token.outputs.token }}' \
                --labels '${{ env.RUNNER_LABEL }}' \
                --unattended \
                --replace \
                --ephemeral
            "

      - name: Start GitHub Actions runner
        run: |
          set -euo pipefail

          gcloud compute ssh "$INSTANCE" \
            --zone="$ZONE" \
            --command="
              cd /home/ubuntu/actions-runner
              sudo -u ubuntu ./run.sh
            "

  training:
    needs: setup

    runs-on: [self-hosted, ga-gpu-runner]

    steps:
      - uses: actions/checkout@v5

      - name: Train model
        run: |
          docker build \
            -f docker/Dockerfile.train \
            -t mlops-train .

          docker create \
            --name mlops-train-run \
            mlops-train

          docker start -a mlops-train-run

          docker cp \
            mlops-train-run:/app/checkpoints/cifar10_model.pt \
            cifar10_model.pt

          docker rm mlops-train-run

      - name: Serve model
        run: |
          docker build \
            -f docker/Dockerfile.serve \
            -t mlops-serve .

          docker create \
            --name mlops-serve-run \
            mlops-serve

          docker start -a mlops-serve-run


