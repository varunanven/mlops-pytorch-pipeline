name: MLOPS Pipeline

on:
  pull_request:
    branches:
      - develop

env:
  ZONE: us-central1-a
  INSTANCE: train-instance-2
  LABEL: ga-spot-${{ github.run_id }}

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: provision gpu runner
        run: |
          set -e

          TOKEN=$(curl -sX POST \
            -H "Authorization: Bearer ${{ secrets.PERSONAL_ACCESS_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/runners/registration-token \
            | jq -r .token)
          test "$TOKEN" != null

          gcloud compute ssh "$INSTANCE" --zone="$ZONE" --command='
          set -euo pipefail

          # 1. Install Docker if missing
          if ! command -v docker >/dev/null 2>&1; then
              echo "Installing Docker..."
              sudo apt-get update
              sudo apt-get install -y docker.io
          fi

          # 2. Fix interactive auth by using explicit sudo
          echo "Starting Docker service..."
          sudo systemctl unmask docker.service
          sudo systemctl unmask docker.socket
          sudo systemctl enable --now docker.service

          # 3. Add ubuntu user to docker group
          if id "ubuntu" &>/dev/null; then
              sudo usermod -aG docker ubuntu
          fi

          # 4. Configure and run GitHub Actions Runner as the ubuntu user
          echo "Setting up GitHub Actions Runner..."
          sudo su - ubuntu -c "
              set -euo pipefail
              mkdir -p ~/actions-runner && cd ~/actions-runner
              
              # Download runner package if not present
              if [ ! -f runner.tgz ]; then
                  curl -L -o runner.tgz https://github.com
                  tar xzf runner.tgz
              fi

              # FIX: Explicitly install lsb-release & libicu packages first 
              # This keeps the automation from throwing "exit code 1"
              echo \"Pre-installing lsb-release and libicu to prevent dependency failures...\"
              sudo apt-get update
              sudo apt-get install -y lsb-release libicu-dev

              # Run the official dependency installer (will now pass safely)
              echo \"Running internal dependency installer...\"
              sudo ./bin/installdependencies.sh

              # Configure the runner
              ./config.sh --url https://github.com/'"${{ github.repository }}"' \
                          --token "'"$TOKEN"'" \
                          --labels "'"$LABEL"'" \
                          --unattended --replace --ephemeral

              # Start runner safely in the background
              echo \"Starting runner in background...\"
              nohup ./run.sh > runner.log 2>&1 &
            "
          '


  training:
    needs: setup
    runs-on: [self-hosted, "ga-spot-${{ github.run_id }}"]
    steps:
      - uses: actions/checkout@v5

      - name: train model
        run: |
          docker build -f docker/Dockerfile.train -t mlops-train .
          docker create --name mlops-train-run mlops-train
          docker start -a mlops-train-run
          docker cp mlops-train-run:/app/checkpoints/cifar10_model.pt cifar10_model.pt
          docker rm mlops-train-run

      - name: serve model
        run: |
          docker build -f docker/Dockerfile.serve -t mlops-serve .
          docker create --name mlops-serve-run mlops-serve
          docker start -a mlops-serve-run

