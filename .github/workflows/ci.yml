name: MLOPS Pipeline

on:
  pull_request:
    branches:
      - develop

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - name: repo checkout
        uses: actions/checkout@v5

      - name: authenticate gcp
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: setup google cloud sdk
        uses: google-github-actions/setup-gcloud@v3

      - name: provision instance
        run: |
          gcloud compute instances create "ga-instance" \
            --source-instance-template=ga-gpu-spot-instance-template \
            --metadata=startup-script="mkdir actions-runner && cd actions-runner && curl -o actions-runner-linux-x64-2.331.0.tar.gz -L https://github.com && tar xzf ./actions-runner-linux-x64-2.331.0.tar.gz && ./config.sh --url https://github.com{{ github.repository }} --token ${{ secrets.PERSONAL_ACCESS_TOKEN }} --labels ga-spot-instance --unattended && ./run.sh"

  training:
    needs: setup
    runs-on: [self-hosted, ga-spot-instance]
    steps:
      - name: repo checkout
        uses: actions/checkout@v5

      - name: execute model train
        run: python3 train.py

      - name: set checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: l4-spot-weights
          path: model.pth

  cleanup:
    needs: [setup, training]
    runs-on: ubuntu-latest
    steps:
      - name: shutdown instance
        run: |
          gcloud compute instances delete ga-runner-{{ github.run_id }} --zone=us-central1-a --quiet